name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "unformatted: $out"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./... -count=1
      - name: test (pure Go, no assembly)
        run: go test -tags purego ./... -count=1
      - name: race
        run: go test -race ./stream/ ./model/ ./drift/ -count=1

  cross:
    # The codec must be bit-identical across architectures; at minimum it must
    # compile for arm64 and the scalar path must be exercisable there.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [arm64, 386]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: compile
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: fuzz the stream header and frame parser
        run: go test ./stream/ -run XXX -fuzz FuzzDecompress -fuzztime 30s
